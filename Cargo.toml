[workspace]
resolver = "2"
members = ["crates/render-latex-worker"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
hex = "0.4"
png = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ratex-layout = { git = "https://github.com/erweixin/RaTeX", rev = "7d9f9a39218914bead8ffdf39b79028a01d12c22", package = "ratex-layout" }
ratex-parser = { git = "https://github.com/erweixin/RaTeX", rev = "7d9f9a39218914bead8ffdf39b79028a01d12c22", package = "ratex-parser" }
ratex-render = { git = "https://github.com/erweixin/RaTeX", rev = "7d9f9a39218914bead8ffdf39b79028a01d12c22", package = "ratex-render", features = ["embed-fonts"] }
ratex-types = { git = "https://github.com/erweixin/RaTeX", rev = "7d9f9a39218914bead8ffdf39b79028a01d12c22", package = "ratex-types" }
